name: Worker Windows Native Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, feat/ai-map-generator]
    paths:
      - "worker/**"
      - ".github/workflows/worker-windows-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-windows-smoke.yml"

jobs:
  native-export:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "1"
      BLENDER_VERSION: "4.5.13"
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 4.5.13 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.blender.org/release/Blender4.5/blender-$env:BLENDER_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\blender.zip"
          Expand-Archive "$env:RUNNER_TEMP\blender.zip" -DestinationPath "$env:RUNNER_TEMP\blender"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\blender" -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $bin) { throw "blender.exe not found" }
          "BLENDER_BIN=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and enable Sollumz 2.9.x
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:BLENDER_BIN --online-mode --command extension repo-add mapforge_sollumz --name "Sollumz" --url "https://repo.sollumz.org/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to add Sollumz repository" }
          & $env:BLENDER_BIN --online-mode --command extension install -s -e sollumz
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Sollumz" }

      - name: Verify Sollumz and native provider
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expr = @'
          import bpy
          import importlib
          import sys
          roots=[m for m in sys.modules if m=='sollumz' or m.endswith('.sollumz')]
          if not roots:
              raise RuntimeError('Sollumz module not loaded')
          deps=importlib.import_module(f'{roots[0]}.dependencies')
          print('MAP_FORGE_NATIVE=' + str(deps.IS_SZIO_NATIVE_AVAILABLE))
          if not deps.IS_SZIO_NATIVE_AVAILABLE:
              raise RuntimeError(deps.PYMATERIA_REQUIRED_MSG or 'Native provider unavailable')
          '@
          & $env:BLENDER_BIN --online-mode --background --python-expr $expr
          if ($LASTEXITCODE -ne 0) { throw "Sollumz native provider is unavailable" }

      - name: Build textured GLB fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = @'
          import bpy
          import os

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, radius=1.0)
          obj = bpy.context.active_object
          obj.name = 'smoke_textured_asset'
          obj.scale = (4.0, 4.0, 1.0)
          bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)

          image = bpy.data.images.new('smoke_diffuse', width=1024, height=1024)
          image.generated_color = (0.32, 0.36, 0.4, 1.0)
          image.pack()

          mat = bpy.data.materials.new('smoke_material')
          mat.use_nodes = True
          nodes = mat.node_tree.nodes
          links = mat.node_tree.links
          bsdf = nodes.get('Principled BSDF')
          tex = nodes.new('ShaderNodeTexImage')
          tex.image = image
          links.new(tex.outputs['Color'], bsdf.inputs['Base Color'])
          obj.data.materials.append(mat)

          bpy.ops.object.select_all(action='DESELECT')
          obj.select_set(True)
          bpy.context.view_layer.objects.active = obj
          bpy.ops.export_scene.gltf(filepath=os.environ['SMOKE_GLB'], export_format='GLB', use_selection=True)
          '@
          $fixtureScript = "$env:RUNNER_TEMP\build_smoke_glb.py"
          $glb = "$env:RUNNER_TEMP\smoke-textured.glb"
          Set-Content -Path $fixtureScript -Value $script -Encoding utf8
          $env:SMOKE_GLB = $glb
          "SMOKE_GLB=$glb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:BLENDER_BIN --factory-startup --background --python $fixtureScript
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $glb)) { throw "Failed to build textured GLB fixture" }

      - name: Export textured SceneSpec to native FiveM resource
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\map-forge-output"
          $wrapper = @'
          import importlib.util
          import json
          import os
          from pathlib import Path

          module_path = Path('worker/export_scene.py').resolve()
          spec = importlib.util.spec_from_file_location('mapforge_export', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.download_sloyd_glb = lambda source, directory: Path(os.environ['SMOKE_GLB']).resolve()

          with Path('worker/fixtures/smoke.scene.json').open('r', encoding='utf-8') as handle:
              scene = json.load(handle)
          module.export_scene(scene, Path(os.environ['SMOKE_OUT']).resolve())
          '@
          $wrapperPath = "$env:RUNNER_TEMP\run_mapforge_smoke.py"
          Set-Content -Path $wrapperPath -Value $wrapper -Encoding utf8
          $env:SMOKE_OUT = $out
          & $env:BLENDER_BIN --online-mode --background --python $wrapperPath
          if ($LASTEXITCODE -ne 0) { throw "Blender/Sollumz textured export failed" }

          $stream = Join-Path $out "fivem_resource\stream"
          foreach ($ext in @(".ydr", ".ytd", ".ytyp", ".ymap")) {
            $match = Get-ChildItem $stream -File | Where-Object { $_.Extension.ToLowerInvariant() -eq $ext } | Select-Object -First 1
            if (-not $match) { throw "Missing required native asset: $ext" }
          }
          if (-not (Test-Path (Join-Path $out "fivem_resource\fxmanifest.lua"))) { throw "Missing fxmanifest.lua" }

      - name: Upload smoke resource for inspection
        uses: actions/upload-artifact@v4
        with:
          name: fivem-map-smoke-resource
          path: ${{ runner.temp }}/map-forge-output/fivem_resource
          if-no-files-found: error
          retention-days: 3
