name: Worker Windows Native Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, feat/ai-map-generator]
    paths:
      - "worker/**"
      - ".github/workflows/worker-windows-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-windows-smoke.yml"

jobs:
  native-export:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "1"
      BLENDER_VERSION: "4.5.13"
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 4.5.13 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.blender.org/release/Blender4.5/blender-$env:BLENDER_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\blender.zip"
          Expand-Archive "$env:RUNNER_TEMP\blender.zip" -DestinationPath "$env:RUNNER_TEMP\blender"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\blender" -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $bin) { throw "blender.exe not found" }
          "BLENDER_BIN=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and enable Sollumz 2.9.x
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:BLENDER_BIN --command extension repo-add mapforge_sollumz --name "Sollumz" --url "https://repo.sollumz.org/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to add Sollumz repository" }
          & $env:BLENDER_BIN --command extension install -s -e sollumz
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Sollumz" }

      - name: Verify Sollumz and native provider
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expr = @'
          import bpy
          import importlib
          import sys
          roots=[m for m in sys.modules if m=='sollumz' or m.endswith('.sollumz')]
          if not roots:
              raise RuntimeError('Sollumz module not loaded')
          deps=importlib.import_module(f'{roots[0]}.dependencies')
          print('MAP_FORGE_NATIVE=' + str(deps.IS_SZIO_NATIVE_AVAILABLE))
          if not deps.IS_SZIO_NATIVE_AVAILABLE:
              raise RuntimeError(deps.PYMATERIA_REQUIRED_MSG or 'Native provider unavailable')
          '@
          & $env:BLENDER_BIN --background --python-expr $expr
          if ($LASTEXITCODE -ne 0) { throw "Sollumz native provider is unavailable" }

      - name: Export smoke SceneSpec to native FiveM resource
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\map-forge-output"
          & $env:BLENDER_BIN --background --python "worker\export_scene.py" -- "worker\fixtures\smoke.scene.json" $out
          if ($LASTEXITCODE -ne 0) { throw "Blender/Sollumz export failed" }
          $stream = Join-Path $out "fivem_resource\stream"
          foreach ($ext in @(".ydr", ".ytyp", ".ymap")) {
            $match = Get-ChildItem $stream -File | Where-Object { $_.Extension.ToLowerInvariant() -eq $ext } | Select-Object -First 1
            if (-not $match) { throw "Missing required native asset: $ext" }
          }
          if (-not (Test-Path (Join-Path $out "fivem_resource\fxmanifest.lua"))) { throw "Missing fxmanifest.lua" }

      - name: Upload smoke resource for inspection
        uses: actions/upload-artifact@v4
        with:
          name: fivem-map-smoke-resource
          path: ${{ runner.temp }}/map-forge-output/fivem_resource
          if-no-files-found: error
          retention-days: 3
